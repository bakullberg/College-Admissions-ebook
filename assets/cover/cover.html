<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#283593;}
  svg{display:block}
  .t{font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;}
</style></head>
<body>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3949ab"/>
      <stop offset="1" stop-color="#1a237e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.48" r="0.5">
      <stop offset="0" stop-color="#5c6bc0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5c6bc0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d1240" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- soft dots -->
  <g fill="#ffffff" opacity="0.07">
    <circle cx="60" cy="40" r="3"/><circle cx="300" cy="30" r="2"/><circle cx="610" cy="20" r="3"/>
    <circle cx="940" cy="40" r="2"/><circle cx="1150" cy="260" r="3"/><circle cx="20" cy="300" r="2"/>
    <circle cx="640" cy="610" r="3"/><circle cx="1180" cy="610" r="2"/><circle cx="260" cy="430" r="2"/>
  </g>

  <!-- winding road -->
  <path d="M -40 600 C 160 520, 120 420, 300 420 S 520 470, 600 470 S 820 430, 900 330 S 980 200, 1240 150"
        fill="none" stroke="#c5cae9" stroke-opacity="0.35" stroke-width="64" stroke-linecap="round"/>
  <path d="M -40 600 C 160 520, 120 420, 300 420 S 520 470, 600 470 S 820 430, 900 330 S 980 200, 1240 150"
        fill="none" stroke="#e8eaf6" stroke-opacity="0.55" stroke-width="50" stroke-linecap="round"/>
  <path d="M -40 600 C 160 520, 120 420, 300 420 S 520 470, 600 470 S 820 430, 900 330 S 980 200, 1240 150"
        fill="none" stroke="#ff9800" stroke-width="4" stroke-dasharray="18 16" stroke-linecap="round"/>
  <!-- milestone pins on the road -->
  <g fill="#ff9800" stroke="#fff" stroke-width="3">
    <circle cx="300" cy="420" r="9"/><circle cx="600" cy="470" r="9"/><circle cx="900" cy="330" r="9"/>
  </g>

  <!-- ===== montage badges ===== -->
  <g filter="url(#shadow)">
    <!-- 1 clipboard checklist (top-left) -->
    <g transform="translate(135,120)">
      <circle r="66" fill="#e8eaf6"/>
      <rect x="-30" y="-40" width="60" height="78" rx="6" fill="#fff" stroke="#283593" stroke-width="3"/>
      <rect x="-14" y="-48" width="28" height="14" rx="4" fill="#ff9800" stroke="#283593" stroke-width="2"/>
      <g stroke="#283593" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M-20 -18 l5 5 l9 -10"/><path d="M-20 2 l5 5 l9 -10"/>
        <rect x="-21" y="17" width="12" height="12" rx="2"/>
      </g>
      <g stroke="#9fa8da" stroke-width="4" stroke-linecap="round">
        <line x1="0" y1="-15" x2="20" y2="-15"/><line x1="0" y1="5" x2="20" y2="5"/><line x1="0" y1="24" x2="20" y2="24"/>
      </g>
    </g>

    <!-- 2 calendar (top) -->
    <g transform="translate(390,88)">
      <circle r="62" fill="#e8eaf6"/>
      <rect x="-36" y="-30" width="72" height="62" rx="7" fill="#fff" stroke="#283593" stroke-width="3"/>
      <rect x="-36" y="-30" width="72" height="16" rx="7" fill="#3f51b5"/>
      <rect x="-36" y="-20" width="72" height="6" fill="#3f51b5"/>
      <line x1="-20" y1="-38" x2="-20" y2="-24" stroke="#283593" stroke-width="4" stroke-linecap="round"/>
      <line x1="20" y1="-38" x2="20" y2="-24" stroke="#283593" stroke-width="4" stroke-linecap="round"/>
      <g fill="#c5cae9">
        <rect x="-27" y="-6" width="10" height="9" rx="2"/><rect x="-12" y="-6" width="10" height="9" rx="2"/>
        <rect x="3" y="-6" width="10" height="9" rx="2"/><rect x="18" y="-6" width="10" height="9" rx="2"/>
        <rect x="-27" y="10" width="10" height="9" rx="2"/><rect x="-12" y="10" width="10" height="9" rx="2"/>
        <rect x="18" y="10" width="10" height="9" rx="2"/>
      </g>
      <circle cx="8" cy="14.5" r="10" fill="none" stroke="#ff9800" stroke-width="4"/>
    </g>

    <!-- 3 bubble sheet + pencil (top) -->
    <g transform="translate(810,88)">
      <circle r="62" fill="#e8eaf6"/>
      <rect x="-30" y="-38" width="56" height="74" rx="5" fill="#fff" stroke="#283593" stroke-width="3"/>
      <g stroke="#283593" stroke-width="2" fill="none">
        <circle cx="-16" cy="-22" r="5"/><circle cx="-2" cy="-22" r="5" fill="#283593"/><circle cx="12" cy="-22" r="5"/>
        <circle cx="-16" cy="-6" r="5" fill="#283593"/><circle cx="-2" cy="-6" r="5"/><circle cx="12" cy="-6" r="5"/>
        <circle cx="-16" cy="10" r="5"/><circle cx="-2" cy="10" r="5"/><circle cx="12" cy="10" r="5" fill="#283593"/>
        <circle cx="-16" cy="26" r="5"/><circle cx="-2" cy="26" r="5" fill="#283593"/><circle cx="12" cy="26" r="5"/>
      </g>
      <g transform="translate(28,4) rotate(35)">
        <rect x="-6" y="-40" width="12" height="62" fill="#ffb300" stroke="#283593" stroke-width="2"/>
        <rect x="-6" y="-48" width="12" height="9" fill="#f48fb1" stroke="#283593" stroke-width="2"/>
        <path d="M-6 22 L0 36 L6 22 Z" fill="#ffe0b2" stroke="#283593" stroke-width="2"/>
        <path d="M-2 31 L0 36 L2 31 Z" fill="#283593"/>
      </g>
    </g>

    <!-- 4 laptop with form (top-right) -->
    <g transform="translate(1068,122)">
      <circle r="66" fill="#e8eaf6"/>
      <rect x="-42" y="-34" width="84" height="54" rx="5" fill="#283593"/>
      <rect x="-36" y="-28" width="72" height="42" rx="2" fill="#fff"/>
      <rect x="-30" y="-22" width="40" height="6" rx="3" fill="#9fa8da"/>
      <g stroke="#283593" stroke-width="2" fill="none"><rect x="-30" y="-11" width="8" height="8"/><rect x="-30" y="1" width="8" height="8"/></g>
      <path d="M-29 -7 l2 2 l4 -5" stroke="#ff9800" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <rect x="-18" y="-10" width="30" height="5" rx="2.5" fill="#c5cae9"/><rect x="-18" y="2" width="22" height="5" rx="2.5" fill="#c5cae9"/>
      <rect x="16" y="-10" width="14" height="18" rx="2" fill="#e8eaf6"/>
      <rect x="-30" y="9" width="60" height="3" rx="1.5" fill="#e0e0e0"/><rect x="-30" y="9" width="40" height="3" rx="1.5" fill="#ff9800"/>
      <path d="M-52 20 h104 l-8 10 h-88 z" fill="#3f51b5" stroke="#283593" stroke-width="2"/>
    </g>

    <!-- 5 essay with revisions (right) -->
    <g transform="translate(1092,322)">
      <circle r="62" fill="#e8eaf6"/>
      <path d="M-28 -38 h42 l14 14 v62 h-56 z" fill="#fff" stroke="#283593" stroke-width="3"/>
      <path d="M14 -38 v14 h14" fill="#e8eaf6" stroke="#283593" stroke-width="3"/>
      <g stroke="#7986cb" stroke-width="3" stroke-linecap="round">
        <line x1="-19" y1="-20" x2="8" y2="-20"/><line x1="-19" y1="-8" x2="19" y2="-8"/>
        <line x1="-19" y1="4" x2="19" y2="4"/><line x1="-19" y1="16" x2="12" y2="16"/><line x1="-19" y1="28" x2="16" y2="28"/>
      </g>
      <path d="M-21 0 c 10 8, 30 8, 42 -2" stroke="#ff9800" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M14 13 l8 8 M22 13 l-8 8" stroke="#ff9800" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- 6 award letter bar chart (bottom-right) -->
    <g transform="translate(1062,520)">
      <circle r="62" fill="#e8eaf6"/>
      <line x1="-36" y1="30" x2="38" y2="30" stroke="#283593" stroke-width="3" stroke-linecap="round"/>
      <rect x="-26" y="-34" width="22" height="64" rx="3" fill="#3f51b5"/>
      <rect x="-26" y="-34" width="22" height="20" rx="3" fill="#ff9800"/>
      <rect x="8" y="-14" width="22" height="44" rx="3" fill="#3f51b5"/>
      <rect x="8" y="-14" width="22" height="30" rx="3" fill="#ff9800"/>
      <text x="-15" y="-40" text-anchor="middle" class="t" font-size="13" font-weight="700" fill="#283593">$</text>
      <text x="19" y="-20" text-anchor="middle" class="t" font-size="13" font-weight="700" fill="#283593">$</text>
    </g>

    <!-- 7 envelope + confetti (bottom) -->
    <g transform="translate(790,548)">
      <circle r="62" fill="#e8eaf6"/>
      <rect x="-24" y="-40" width="48" height="44" rx="3" fill="#fff" stroke="#283593" stroke-width="2.5"/>
      <g stroke="#9fa8da" stroke-width="3" stroke-linecap="round"><line x1="-15" y1="-28" x2="15" y2="-28"/><line x1="-15" y1="-18" x2="10" y2="-18"/></g>
      <path d="M-38 -8 L0 18 L38 -8 V32 H-38 Z" fill="#3f51b5" stroke="#283593" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M-38 32 L-6 10 M38 32 L6 10" stroke="#283593" stroke-width="2.5"/>
      <g>
        <rect x="-46" y="-48" width="7" height="11" fill="#ff9800" transform="rotate(-25 -42 -42)"/>
        <rect x="38" y="-52" width="7" height="11" fill="#f48fb1" transform="rotate(30 41 -46)"/>
        <circle cx="-30" cy="-54" r="4" fill="#ffd54f"/><circle cx="26" cy="-58" r="4" fill="#80cbc4"/>
        <path d="M44 -26 l3 -7 l3 7 l7 1 l-5 5 l1 7 l-6 -3 l-6 3 l1 -7 l-5 -5 z" fill="#ffd54f"/>
      </g>
    </g>

    <!-- 8 move-in box + campus (bottom) -->
    <g transform="translate(470,548)">
      <circle r="62" fill="#e8eaf6"/>
      <!-- campus building behind -->
      <rect x="-12" y="-46" width="16" height="22" fill="#c5cae9" stroke="#283593" stroke-width="2"/>
      <path d="M-15 -46 L-4 -58 L7 -46 Z" fill="#3f51b5" stroke="#283593" stroke-width="2"/>
      <circle cx="-4" cy="-37" r="5" fill="#fff" stroke="#283593" stroke-width="1.5"/>
      <rect x="-40" y="-26" width="72" height="34" fill="#c5cae9" stroke="#283593" stroke-width="2"/>
      <g fill="#3f51b5"><rect x="-32" y="-20" width="8" height="10"/><rect x="-18" y="-20" width="8" height="10"/><rect x="10" y="-20" width="8" height="10"/><rect x="22" y="-20" width="6" height="10"/></g>
      <!-- tree -->
      <rect x="36" y="-12" width="5" height="20" fill="#795548"/><circle cx="38" cy="-18" r="13" fill="#66bb6a"/>
      <!-- box -->
      <rect x="-30" y="0" width="52" height="38" fill="#d7a86e" stroke="#283593" stroke-width="2.5"/>
      <path d="M-30 0 l10 -10 h52 l-10 10 z" fill="#e6c08f" stroke="#283593" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="-4" y1="0" x2="-4" y2="38" stroke="#b07c40" stroke-width="5"/>
      <!-- lamp & pillow peeking -->
      <path d="M-22 -4 c0 -12 18 -12 18 0 z" fill="#fff" stroke="#283593" stroke-width="2"/>
      <line x1="10" y1="-4" x2="14" y2="-24" stroke="#283593" stroke-width="3"/>
      <path d="M6 -24 h18 l-4 -12 h-10 z" fill="#ff9800" stroke="#283593" stroke-width="2"/>
    </g>
  </g>

  <!-- ===== title ===== -->
  <rect x="236" y="190" width="728" height="226" rx="28" fill="#1a237e" fill-opacity="0.82" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
  <text x="600" y="282" text-anchor="middle" class="t" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="0.5">College Admissions</text>
  <text x="600" y="356" text-anchor="middle" class="t" font-size="74" font-weight="700" fill="#ffb74d" letter-spacing="1">Roadmap</text>
  <text x="600" y="392" text-anchor="middle" class="t" font-size="20" font-weight="500" fill="#c5cae9">Your step-by-step guide from college list to move-in day</text>

  <!-- ===== Scout ===== -->
  <ellipse cx="120" cy="598" rx="72" ry="12" fill="#0d1240" opacity="0.35"/>
  <image href="scout.png" x="42" y="404" width="156" height="200" preserveAspectRatio="xMidYMax meet"/>
</svg>
</body></html>
